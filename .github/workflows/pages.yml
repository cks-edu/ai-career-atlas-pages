name: Publish AI Career Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Package public website only
        run: |
          mkdir _site
          cp index.html favicon.svg .nojekyll atlas-styles-*.css _site/
          cp -R assets _site/
          node -e 'const fs=require("fs"),crypto=require("crypto"),m=JSON.parse(fs.readFileSync("_site/assets/styles-manifest.json"));const css=fs.readFileSync("_site/"+m.src);if(crypto.createHash("sha256").update(css).digest("hex")!==m.sha256)throw Error("Stylesheet hash mismatch");if(!fs.readFileSync("_site/index.html","utf8").includes(m.src))throw Error("Stylesheet link missing");'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
